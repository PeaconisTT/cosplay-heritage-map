<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bản đồ Cosplay Ảo - Digital Heritage Atlas</title>
  <link rel="stylesheet" href="/src/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body class="relative">

  <!-- Header Điều hướng Lọc Bản đồ & Chế độ xem -->
  <header class="absolute top-4 left-4 z-[1000] bg-slate-800/90 backdrop-blur-md border border-slate-700 text-white p-3.5 rounded-2xl shadow-2xl flex flex-wrap gap-3 items-center">
    <div class="flex items-center gap-2">
      <h1 class="font-bold text-lg text-brand-500 whitespace-nowrap">📍 Cosplay Map</h1>
    </div>

    <!-- Custom Dropdown Chọn Chế độ Bản đồ chính -->
    <div id="map-mode-dropdown" class="relative custom-dropdown">
      <button id="map-mode-trigger" type="button" class="custom-dropdown-trigger bg-slate-800 text-slate-100 border border-slate-600 shadow-sm hover:bg-slate-700 hover:border-indigo-400 hover:text-white active:bg-indigo-950 active:border-indigo-500 active:text-indigo-200 active:scale-95 transition-all duration-150 ease-out cursor-pointer text-sm rounded-xl px-3 py-2 flex items-center gap-2">
        <span id="map-mode-label" class="flex items-center gap-1.5 whitespace-nowrap">
          🌐 Tất cả tác phẩm
        </span>
        <svg class="dropdown-chevron w-4 h-4 text-slate-400 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
        </svg>
      </button>

      <div id="map-mode-menu" class="custom-dropdown-menu absolute top-full left-0 mt-2 min-w-[210px] max-h-64 overflow-y-auto rounded-xl bg-slate-900/95 backdrop-blur-md border border-slate-700 shadow-2xl p-1.5 z-[1100] opacity-0 -translate-y-2.5 pointer-events-none invisible transition-all duration-200 ease-out">
        <button type="button" class="custom-dropdown-item w-full text-left px-3 py-2 rounded-lg text-sm text-slate-200 flex items-center justify-between transition-colors duration-150 cursor-pointer hover:bg-indigo-600/30 hover:text-white active:bg-indigo-600 active:text-white bg-indigo-600/20 text-indigo-300 font-semibold" data-value="ALL">
          <span>🌐 Tất cả tác phẩm</span>
          <span class="check-icon text-indigo-400">✓</span>
        </button>
        <button type="button" class="custom-dropdown-item w-full text-left px-3 py-2 rounded-lg text-sm text-slate-200 flex items-center justify-between transition-colors duration-150 cursor-pointer hover:bg-indigo-600/30 hover:text-white active:bg-indigo-600 active:text-white" data-value="EVENT">
          <span>🎪 Map Sự kiện Fest</span>
          <span class="check-icon hidden text-indigo-400">✓</span>
        </button>
        <button type="button" class="custom-dropdown-item w-full text-left px-3 py-2 rounded-lg text-sm text-slate-200 flex items-center justify-between transition-colors duration-150 cursor-pointer hover:bg-indigo-600/30 hover:text-white active:bg-indigo-600 active:text-white" data-value="IP">
          <span>📖 Map Tác phẩm IP</span>
          <span class="check-icon hidden text-indigo-400">✓</span>
        </button>
        <button type="button" class="custom-dropdown-item w-full text-left px-3 py-2 rounded-lg text-sm text-slate-200 flex items-center justify-between transition-colors duration-150 cursor-pointer hover:bg-indigo-600/30 hover:text-white active:bg-indigo-600 active:text-white" data-value="COSPLAYER">
          <span>👤 Map Cosplayer (A-Z)</span>
          <span class="check-icon hidden text-indigo-400">✓</span>
        </button>
      </div>
    </div>

    <!-- Vùng Bộ lọc Phụ Động (Sub-filter Container với Custom Dropdown) -->
    <div id="sub-filter-container" class="opacity-0 -translate-y-2.5 pointer-events-none invisible transition-all duration-200 ease-out flex items-center gap-2">
      <!-- Sẽ được render động qua JS tùy theo mode được chọn -->
    </div>

    <div class="h-6 w-px bg-slate-700 hidden sm:block"></div>

    <!-- Bộ chuyển đổi Chế độ Xem (View Mode Toggle) -->
    <div class="flex items-center bg-slate-900/90 border border-slate-700 rounded-xl p-1 text-xs gap-1">
      <button id="view-mode-popup" type="button" class="view-mode-btn px-3 py-1.5 rounded-lg font-medium transition-all duration-150 ease-out cursor-pointer flex items-center gap-1.5 bg-indigo-600 text-white border border-indigo-400 shadow-inner" data-mode="popup">
        <span>💬</span>
        <span>Bong bóng nổi</span>
      </button>
      <button id="view-mode-panel" type="button" class="view-mode-btn px-3 py-1.5 rounded-lg font-medium transition-all duration-150 ease-out cursor-pointer flex items-center gap-1.5 bg-slate-800 text-slate-100 border border-slate-600 shadow-sm hover:bg-slate-700 hover:border-indigo-400 hover:text-white active:bg-indigo-950 active:border-indigo-500 active:text-indigo-200 active:scale-95" data-mode="panel">
        <span>◧</span>
        <span>Panel bên trái</span>
      </button>
    </div>

    <button id="btn-reload" class="bg-indigo-600 text-white font-medium text-sm px-4 py-2 rounded-xl shadow-md shadow-indigo-600/30 border border-indigo-500/50 hover:bg-indigo-700 active:bg-indigo-800 active:scale-95 transition-all duration-150 ease-out cursor-pointer flex items-center gap-1.5">
      <span>🔄</span>
      <span>Tải lại</span>
    </button>
  </header>

  <!-- Element chứa Bản đồ Leaflet -->
  <div id="map"></div>

  <!-- Floating Left Panel hiển thị chi tiết Pin / Cụm tròn (#left-detail-panel) -->
  <aside id="left-detail-panel" class="fixed left-4 top-24 bottom-6 w-[440px] max-w-[calc(100vw-2rem)] z-[1000] bg-slate-900/95 backdrop-blur-md border border-slate-700 rounded-2xl shadow-2xl flex flex-col overflow-hidden text-white opacity-0 -translate-x-6 scale-95 pointer-events-none invisible transition-all duration-250 ease-[cubic-bezier(0.16,1,0.3,1)]">
    <!-- Panel Header -->
    <div class="p-3.5 border-b border-slate-800 flex items-center justify-between bg-slate-950/80 shrink-0">
      <span id="left-panel-title" class="font-bold text-sm text-brand-500 flex items-center gap-1.5 truncate">
        📍 Chi tiết Tác phẩm
      </span>
      <button id="btn-close-left-panel" type="button" class="w-8 h-8 rounded-lg flex items-center justify-center bg-slate-800 text-slate-300 border border-slate-700 hover:bg-rose-600 hover:border-rose-500 hover:text-white active:bg-rose-800 active:scale-95 transition-all duration-150 ease-out cursor-pointer" title="Đóng panel">
        ✕
      </button>
    </div>
    <!-- Panel Body cuộn dọc với transition chuyển cảnh mượt mà -->
    <div id="left-panel-body" class="p-4 flex-1 overflow-y-auto space-y-3 transition-all duration-200 ease-out opacity-100 translate-y-0">
      <!-- Nội dung động được render bằng JavaScript -->
    </div>
  </aside>

  <!-- Modal Upload Pin & Chữ ký tay -->
  <div id="upload-modal" class="fixed inset-0 z-[2000] bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 opacity-0 pointer-events-none invisible transition-all duration-250 ease-out">
    <div id="upload-modal-card" class="bg-slate-900 border border-slate-700 text-white rounded-2xl w-full max-w-lg shadow-2xl overflow-hidden flex flex-col max-h-[90vh] opacity-0 scale-90 translate-y-3 transition-all duration-250 ease-[cubic-bezier(0.16,1,0.3,1)]">
      
      <!-- Modal Header -->
      <div class="p-4 border-b border-slate-800 flex justify-between items-center bg-slate-950">
        <h2 class="font-bold text-lg text-brand-500">✍️ Đăng tải Tác phẩm & Ký tên</h2>
        <button id="btn-close-modal" type="button" class="w-8 h-8 rounded-lg flex items-center justify-center bg-slate-800 text-slate-300 border border-slate-700 hover:bg-rose-600 hover:border-rose-500 hover:text-white active:bg-rose-800 active:scale-95 transition-all duration-150 ease-out cursor-pointer" title="Đóng modal">✕</button>
      </div>

    <!-- Modal Form Body -->
    <form id="upload-pin-form" class="p-5 space-y-4 overflow-y-auto flex-1">
      
      <!-- Tọa độ 2D -->
      <div class="grid grid-cols-2 gap-3 bg-slate-800/50 p-3 rounded-xl border border-slate-700/50">
        <div>
          <label class="text-xs text-slate-400 block mb-1">Tọa độ X</label>
          <input type="text" id="input-coord-x" readonly class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-amber-400 font-mono" />
        </div>
        <div>
          <label class="text-xs text-slate-400 block mb-1">Tọa độ Y</label>
          <input type="text" id="input-coord-y" readonly class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs text-amber-400 font-mono" />
        </div>
      </div>

      <!-- Chọn File Ảnh (Đã đổi thành Optional) -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Ảnh Tác Phẩm <span class="text-slate-400 font-normal">(Tùy chọn)</span></label>
        <input type="file" id="input-file" accept="image/*" class="w-full text-xs text-slate-300 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-brand-500 file:text-white hover:file:bg-brand-600 cursor-pointer" />
      </div>

      <!-- Cosplayer & Nhân vật (Combobox datalist) -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Cosplayer (*)</label>
          <input type="text" id="input-cosplayer-name" required placeholder="Nghệ danh" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-500" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Nhân vật (*)</label>
          <input type="text" id="input-character-name" list="character-datalist" required placeholder="Nhập hoặc chọn menu" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-500" />
          <datalist id="character-datalist"></datalist>
        </div>
      </div>

      <!-- Tên Tác phẩm (Combobox datalist) & Phân loại -->
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Tên Tác phẩm (*)</label>
          <input type="text" id="input-work-title" list="work-title-datalist" required placeholder="Nhập hoặc chọn menu" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-500" />
          <datalist id="work-title-datalist"></datalist>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Phân loại (*)</label>
          <select id="input-work-category" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-500">
            <option value="MANGA">Manga</option>
            <option value="ANIME">Anime</option>
            <option value="GAME">Game</option>
            <option value="VTUBER">VTuber</option>
            <option value="ORIGINAL">Original</option>
          </select>
        </div>
      </div>

      <!-- Tên Sự kiện / Fest & Lời nhắn kỷ niệm (Tùy chọn) -->
      <div class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Tên Sự kiện / Fest <span class="text-slate-400 font-normal">(Tùy chọn)</span></label>
          <input type="text" id="input-event-name" list="event-name-datalist" placeholder="VD: Fes Mùa Xuân, Color Fiesta, Comic Con..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-500" />
          <datalist id="event-name-datalist"></datalist>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Lời nhắn kỷ niệm <span class="text-slate-400 font-normal">(Tùy chọn)</span></label>
          <input type="text" id="input-message" maxlength="250" placeholder="Cảm xúc hoặc lời nhắn kỷ niệm..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white focus:outline-none focus:border-brand-500" />
        </div>
      </div>

      <!-- Chữ ký tay số hóa + Bảng Chọn Màu Đa Dạng -->
      <div>
        <div class="flex items-center justify-between mb-2">
          <label class="block text-xs font-semibold text-brand-500">Chữ ký tay số hóa (*)</label>
          
          <div class="flex items-center gap-2">
            <!-- Palette các nút màu cố định -->
            <div class="flex items-center gap-1.5" id="color-palette">
              <button type="button" class="btn-color-swatch w-5 h-5 rounded-full bg-white ring-2 ring-brand-500 cursor-pointer" data-color="#ffffff"></button>
              <button type="button" class="btn-color-swatch w-5 h-5 rounded-full bg-red-500 cursor-pointer" data-color="#ff4757"></button>
              <button type="button" class="btn-color-swatch w-5 h-5 rounded-full bg-amber-400 cursor-pointer" data-color="#ffc048"></button>
              <button type="button" class="btn-color-swatch w-5 h-5 rounded-full bg-emerald-400 cursor-pointer" data-color="#2ed573"></button>
              <button type="button" class="btn-color-swatch w-5 h-5 rounded-full bg-sky-400 cursor-pointer" data-color="#1e90ff"></button>
              <button type="button" class="btn-color-swatch w-5 h-5 rounded-full bg-purple-400 cursor-pointer" data-color="#a55eea"></button>
            </div>

            <!-- Custom Color Picker -->
            <label class="relative w-6 h-6 rounded-full overflow-hidden border border-slate-500 cursor-pointer flex items-center justify-center bg-slate-800 hover:border-white" title="Chọn màu tùy chỉnh">
              <input type="color" id="input-custom-color" value="#ffffff" class="absolute -inset-2 w-10 h-10 cursor-pointer opacity-0" />
              <span class="text-[10px]">🎨</span>
            </label>

            <button type="button" id="btn-clear-canvas" class="px-2.5 py-1 rounded-md bg-rose-500/15 text-rose-400 border border-rose-500/30 hover:bg-rose-600 hover:text-white active:bg-rose-800 active:scale-95 transition-all duration-150 ease-out cursor-pointer text-[11px]">Xóa nét</button>
          </div>
        </div>

        <div class="border-2 border-dashed border-slate-700 rounded-xl p-1 bg-slate-950 flex justify-center">
          <canvas id="signature-canvas" width="440" height="150" class="w-full h-[150px] bg-slate-950 rounded-lg touch-none cursor-crosshair"></canvas>
        </div>
        <p class="text-[10px] text-slate-400 mt-1">Dùng chuột hoặc ngón tay vẽ nét ký. Nét vẽ sẽ được băm sang Pixel Matrix Hash phục vụ xác thực C2PA.</p>
      </div>

      <!-- Submit Button -->
      <div class="pt-2">
        <button type="submit" id="btn-submit-pin" class="w-full bg-rose-600 text-white font-semibold py-2.5 rounded-xl shadow-lg shadow-rose-600/30 border border-rose-500/50 hover:bg-rose-700 hover:shadow-rose-700/40 active:bg-rose-800 active:scale-95 transition-all duration-150 ease-out cursor-pointer text-sm">
          Khởi tạo Pin & Lưu Chữ Ký
        </button>
      </div>
    </form>
  </div>
</div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
